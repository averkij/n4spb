function showRules() { const s = S(), el0 = $('rules'); el0.style.display = 'block'; el0.innerHTML = `<button class="btn" style="float:right" id="rulesX">×</button><h2 style="margin:0 0 8px;font-size:18px">${s.rulesTitle}</h2><ol style="margin:0;padding-left:20px;line-height:1.5">${s.rulesList.map((t) => `<li style="margin:6px 0">${t}</li>`).join('')}</ol><p style="margin:10px 0 0;color:var(--muted);font-size:12.5px">${lang === 'ru' ? 'Расстояния: один квартал не глубже ' + D.rules.depthM + ' м; перекрёсток: радиус ' + D.rules.junctionRadiusM + ' м; вода: до ' + D.rules.waterReachM / 1000 + ' км от берега, соседний берег если ближе ' + D.rules.waterBankM + ' м.' : 'Distances: one block at most ' + D.rules.depthM + ' m deep; junction radius ' + D.rules.junctionRadiusM + ' m; water: up to ' + D.rules.waterReachM / 1000 + ' km from a shore, the other bank when within ' + D.rules.waterBankM + ' m.'}</p>`; $('rulesX').onclick = () => { el0.style.display = 'none'; }; }
