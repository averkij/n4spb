# Deploys the static scene to GitHub Pages (https://averkij.github.io/n4spb/): no build step, the deployment whitelist of docs/STRIP.md section 7.
# A pull request runs the CPU 'verify' job (no npm ci: repository files only) and the 'engine' job (npm ci: three.js in node, the hook set and the Tauride tests); nothing is deployed.
# A push to main deploys when BOTH 'verify' and 'engine' passed (M7 polish: 'engine' ran green on GitHub and became a deploy gate: docs/AREAS.md section 11.3).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # a pull request must never cancel the deployment of main (and the other way round): one group per ref
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The CPU oracles of docs/AREAS.md section 5. They import only repository files (no three.js, no browser, no GPU): no 'npm ci'.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # a stale bake makes the page silently rebuild everything procedurally (minutes of load): refuse to publish it. Every live area has its OWN revision (the hash of its dependency closure,
      # tools/baked-revision.mjs): the check recomputes it from the tree and compares it with the manifest, the products (names, sizes, sha256) and the generated src/core/baked-revision.js
      - name: Baked scenes match the source (per area)
        run: node tools/bake-manifest-check.mjs
      # the closure scan is fail-closed: a computed import(), a loaded asset kind or a file nothing imports must be classified (tools/lib/closure-rules.mjs, closure-orphans.txt)
      - name: Dependency closure of every area is fully classified (closure-lint)
        run: node tools/closure-lint.mjs
      - name: No dev / test server answers the bake revision by itself, nobody uses the global revision (dev-servers-lint)
        run: node tools/dev-servers-lint.mjs
      - name: Area pages are generated from index.html
        run: node tools/gen-area-html.mjs --check
      - name: Layout contract (every real area)
        run: node tools/each-area.mjs tools/layout-test.mjs
      - name: Landmark claims (every real area)
        run: node tools/each-area.mjs tools/landmarks-groups-check.mjs
      - name: Areas, registry, gate geometry
        run: node tools/areas-test.mjs
      # M6 (docs/AREAS.md section 9). The tests below import no three.js; tools/north-height-test.mjs, the engine part of tools/north-keepout-test.mjs and the --scene part of
      # tools/north-people-hooks-test.mjs build the engine (three.js, 'npm ci'): they run locally with `npm run hooks:all` and in the 'engine' job below (this job has no 'npm ci' on purpose)
      - name: Layout golden of both areas (the hook set moves neither)
        run: |
          node tools/layout-golden.mjs --diff
          node tools/area.mjs north tools/layout-golden.mjs --diff
      # `node --check` only (no 'npm ci' here): the engine files edited by M6 parse. Their call sites are NOT run in this job; that is `npm run hooks:all` (docs/AREAS.md 9.6) and the 'engine' job
      - name: Engine files edited by M6 parse (node --check)
        run: node tools/hooks-syntax-check.mjs
      - name: Hook set contract of the North (M6 - tables, Paradny golden, text checks of the engine files)
        run: node tools/area.mjs north tools/north-hooks-test.mjs
      - name: Keep-out regions of the North (M6, factories and regions only)
        run: node tools/area.mjs north tools/north-keepout-test.mjs --only pure
      - name: Tauride Garden polygon and crowd cap row (M6)
        run: node tools/north-people-hooks-test.mjs
      # The Tauride remake (docs/TAURIDE-REMAKE.md section 10), the two tests that need neither three.js nor python: the committed data modules against the facade (--no-regen: no python / shapely run)
      # and the camera poses of the garden against the data
      - name: Tauride data modules (T0, --no-regen) and camera poses
        run: |
          node tools/tauride/data-test.mjs --no-regen
          node tools/tauride-cams-check.mjs
      - name: Hand-off codec and gates
        run: |
          node tools/handoff-test.mjs
          node tools/gates-test.mjs
      - name: Claims table is current
        run: node tools/owns-table.mjs --check
      - name: Runtime-only files are imported by main.js only
        run: node tools/runtime-only-lint.mjs
      - name: Imports exist with exactly the spelling used (developed on Windows, hosted on Linux)
        run: node tools/import-lint.mjs
      # the per-area bake revision (docs/AREAS.md section 4): CPU oracles, none needs three.js, a browser or the node_modules (the lock entry of three is read from package-lock.json)
      - name: Bake revision per area - order, exclusions, isolation, golden (fixture trees)
        run: node tools/baked-revision-test.mjs
      - name: Bake revision per area - the real tree (which file moves which area), recorded page loads inside the closure
        run: node tools/closure-real-test.mjs
      - name: Bake manifest check - every failure kind (fabricated bake directories)
        run: node tools/bake-manifest-check-test.mjs
      - name: Bake plan, publish and the crash between manifest and map
        run: node tools/bake-plan-test.mjs
      - name: Bake publish (served-file audit, lock, purge) and the whole flow on fabricated trees
        run: node tools/bake-publish-test.mjs && node tools/bake-flow-test.mjs
      - name: MODULES parser fails closed (feeds the closure)
        run: node tools/modules-list-test.mjs
      - name: Generated src/core/baked-revision.js resolves the revision of its page's area
        run: node tools/baked-revision-js-test.mjs
      - name: Dev servers answer the revision of the area of the page (Referer, stat-signature cache)
        run: node tools/dev-revision-test.mjs
      # the scanner is tested against 9 broken scanners (each must be caught): about a minute
      - name: The closure oracles catch 9 of 9 broken scanners
        run: node tools/closure-mutation-test.mjs
      - name: Area data is clipped to its extent (idempotent)
        run: |
          for d in src/world/data src/areas/*/data; do
            if [ -d "$d" ]; then echo "== $d"; node tools/strip-data-clip.mjs --in "$d" --check; fi
          done

  # The CPU tests that build the engine in node (three.js from package-lock.json, no browser, no GPU, no bake): the hook set of M6 with its engine call sites (docs/AREAS.md 9.2, 9.6: `npm run hooks:all`)
  # and the Tauride remake tests of docs/TAURIDE-REMAKE.md section 10 (T2-T4a: the garden floor, the ponds, the relief and the real built module). A separate job so that 'verify' stays free of
  # 'npm ci' and its steps keep running when the engine part is red; since M7 polish it GATES 'deploy' together with 'verify' (docs/AREAS.md sections 5.3 and 11.3). Nothing here reads assets/baked.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hook set of the North with the engine call sites (npm run hooks:all)
        run: npm run hooks:all
      - name: Tauride remake - the garden floor, the painted ground, the alleys (T3)
        run: node tools/area.mjs north tools/tauride/ground-test.mjs
      - name: Tauride remake - the ponds, the shores, the water mask (T4a)
        run: node tools/area.mjs north tools/tauride/pond-test.mjs
      - name: Tauride remake - the height harness self-check and the relief of the REAL built module (T2 / T4a)
        run: |
          node tools/area.mjs north tools/tauride-height-test.mjs
          node tools/area.mjs north tools/tauride-height-test.mjs --model north --build landmarksTauride --assert-cars --no-selfcheck
      - name: Landmark claims are drawn by their owners and by nobody else (every real area)
        run: node tools/each-area.mjs tools/claims-draw-audit.mjs
      - name: The places of the other area and the door gate (M7; every real area)
        run: node tools/each-area.mjs tools/cross-places-test.mjs
      - name: The knockable furniture of the North landmarks (M7)
        run: node tools/area.mjs north tools/north-knock-test.mjs

  deploy:
    needs: [verify, engine]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir dist
          cp -r index.html src assets dist/
          # the other area pages (north.html ...: generated by tools/gen-area-html.mjs, committed) when they exist: every root page that names its area
          for f in *.html; do
            if [ -f "$f" ] && grep -q '<html[^>]* data-area=' "$f"; then cp "$f" dist/; fi
          done
          cp manifest.webmanifest dist/      # add-to-home-screen (assets/icons/ travels with assets/)
          mkdir -p dist/vendor/rapier
          cp vendor/rapier/rapier.js vendor/rapier/LICENSE dist/vendor/rapier/
          cp LICENSE LICENSE-sakuragaoka-station.txt NOTICE.md README.md dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
